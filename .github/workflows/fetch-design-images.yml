name: Fetch design images
# Downloads the generated model images listed in design/models/manifest.json
# into the repo (the Claude workspace can't reach the image CDN).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [design/models/manifest.json, .github/workflows/fetch-design-images.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download missing images
        run: |
          ok=0; bad=0
          while IFS=$'\t' read -r file url; do
            if [ -s "$file" ]; then echo "have $file"; continue; fi
            mkdir -p "$(dirname "$file")"
            code=$(curl -sSL --retry 3 -A "Mozilla/5.0" -o "$file" -w "%{http_code}" "$url" || echo "curl-error")
            if [ "$code" = "200" ] && [ -s "$file" ]; then ok=$((ok+1)); echo "got $file"
            else bad=$((bad+1)); rm -f "$file"; echo "::warning::$code $file"; fi
          done < <(jq -r '.images[] | "\(.file)\t\(.url)"' design/models/manifest.json)
          echo "::notice::downloaded $ok, failed $bad"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add design/models
          git diff --cached --quiet && echo "nothing new" || { git commit -m "Add generated design images from design/models/manifest.json"; git push; }
# Rerun after the .gitignore fix (PNGs under design/ are now tracked).
